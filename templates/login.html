<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Job Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="auth-navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-robot"></i>
                <span>Job Tracker</span>
            </a>
            <div class="auth-nav-links">
                <a href="/signup" class="auth-nav-link">Create Account</a>
                <a href="/" class="auth-nav-link"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="/" class="auth-logo">
                        <i class="fas fa-robot"></i>
                        <span>Job Tracker</span>
                    </a>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your account to continue</p>
                </div>

                <form id="loginForm" class="auth-form" novalidate>
                    <div class="auth-alert-container"></div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                        </div>
                        <span class="field-error" style="display:none"><i class="fas fa-exclamation-circle"></i> Please enter a valid email</span>
                        <span class="field-success" style="display:none"><i class="fas fa-check-circle"></i> Valid email</span>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember" value="1">
                            <span class="checkbox-custom"><i class="fas fa-check"></i></span>
                            Remember me
                        </label>
                        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-btn auth-btn-primary">
                        <span class="spinner-sm"></span>
                        <span class="btn-text">Sign In</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="/signup">Create one</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
