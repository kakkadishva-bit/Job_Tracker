<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JobAgent</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="auth-navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-robot"></i>
                <span>JobAgent</span>
            </a>
            <div class="auth-nav-links">
                <a href="/login" class="auth-nav-link">Sign In</a>
                <a href="/" class="auth-nav-link"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="/" class="auth-logo">
                        <i class="fas fa-robot"></i>
                        <span>JobAgent</span>
                    </a>
                    <h1 class="auth-title">Reset Password</h1>
                    <p class="auth-subtitle">Choose a new password for your account</p>
                </div>

                <form id="resetForm" class="auth-form" novalidate>
                    <div class="auth-alert-container"></div>
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Create a new password" required autocomplete="new-password">
                            <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                            </div>
                            <span id="strengthText" class="strength-text">Enter a password</span>
                        </div>
                        <div class="password-requirements">
                            <span class="requirement unmet" id="req-length" data-label="8+ characters"><i class="fas fa-circle"></i> 8+ characters</span>
                            <span class="requirement unmet" id="req-upper" data-label="Uppercase letter"><i class="fas fa-circle"></i> Uppercase</span>
                            <span class="requirement unmet" id="req-lower" data-label="Lowercase letter"><i class="fas fa-circle"></i> Lowercase</span>
                            <span class="requirement unmet" id="req-number" data-label="Number"><i class="fas fa-circle"></i> Number</span>
                            <span class="requirement unmet" id="req-special" data-label="Special character"><i class="fas fa-circle"></i> Special char</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-check-circle input-icon"></i>
                            <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password">
                            <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                        </div>
                        <span class="field-error" style="display:none"><i class="fas fa-exclamation-circle"></i> Passwords do not match</span>
                    </div>

                    <button type="submit" class="auth-btn auth-btn-primary">
                        <span class="spinner-sm"></span>
                        <span class="btn-text">Reset Password</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p><a href="/login"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
