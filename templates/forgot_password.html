<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - JobAgent</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="auth-navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-robot"></i>
                <span>JobAgent</span>
            </a>
            <div class="auth-nav-links">
                <a href="/login" class="auth-nav-link">Sign In</a>
                <a href="/signup" class="auth-nav-link">Create Account</a>
                <a href="/" class="auth-nav-link"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="/" class="auth-logo">
                        <i class="fas fa-robot"></i>
                        <span>JobAgent</span>
                    </a>
                    <h1 class="auth-title">Forgot Password</h1>
                    <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
                </div>

                <form id="forgotForm" class="auth-form" novalidate>
                    <div class="auth-alert-container"></div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                        </div>
                        <span class="field-error" style="display:none"><i class="fas fa-exclamation-circle"></i> Please enter a valid email</span>
                    </div>

                    <button type="submit" class="auth-btn auth-btn-primary">
                        <span class="spinner-sm"></span>
                        <span class="btn-text">Send Reset Link</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p><a href="/login"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
